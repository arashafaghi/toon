[project]
name = "toon"
version = "0.1.0"
description = "A minimal Textual plugin runner (architecture proof)"
readme = "README.md"
authors = [
    { name = "Arash Afaghi", email = "afaghi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "loguru>=0.7",
    "pydantic>=2.9",
    "textual",
]

[project.scripts]
toon = "toon.app:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "nox>=2024.4.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "textual-dev>=1.8.0",
]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src/toon"]
exclude = ["^plugins/", "^tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
# Don't reformat Python snippets inside Markdown (roadmap/docs).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
